name: Validate and publish FS25 image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: find yolk -name '*.sh' -exec bash -n {} \;
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./yolk
          file: ./yolk/Dockerfile.winehq
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/stepanvalic/fs25-pterodactyl-egg-public:latest
            ghcr.io/stepanvalic/fs25-pterodactyl-egg-public:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
